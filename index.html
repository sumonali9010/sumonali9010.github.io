<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live TV – namta.online</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body {
  margin: 0;
  background: #000;
  font-family: Arial;
}
video {
  width: 100%;
  height: 100vh;
  background: #000;
}
.channel-list {
  padding: 10px;
  background: #111;
}
button {
  padding: 8px 12px;
  margin: 5px;
  background: #222;
  color: #fff;
  border: 1px solid #444;
}
</style>
</head>

<body>

<video id="video" controls autoplay></video>

<div class="channel-list">
  <button onclick="playStream('https://example.com/live.m3u8')">Channel 1</button>
  <button onclick="playStream('https://example2.com/stream.m3u8')">Channel 2</button>
  <button onclick="playIframe()">YouTube</button>
</div>

<script>
var video = document.getElementById('video');
var hls;

function playStream(url) {
  if (hls) {
    hls.destroy();
  }

  if (Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = url;
  }
}

function playIframe() {
  document.body.innerHTML = `
    <iframe src="https://www.youtube.com/embed/live_stream?channel=CHANNEL_ID"
    width="100%" height="100%" frameborder="0" allowfullscreen></iframe>
  `;
}
</script>

</body>
</html>
