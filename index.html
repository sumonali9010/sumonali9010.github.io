<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCPLC Premium | Ultimate TV</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Noto+Sans+Bengali:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #000000;
            --surface: #0d0d0d;
            --accent: #ffffff;
            --text-gray: #a0a0a0;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Inter', 'Noto Sans Bengali', sans-serif;
            margin: 0; padding: 0;
            overflow-x: hidden;
        }

        /* --- Header --- */
        header {
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(15px);
            position: sticky; top: 0; z-index: 1000;
        }
        .logo { font-size: 18px; font-weight: 800; letter-spacing: 2px; }
        .clock { font-size: 12px; color: var(--text-gray); font-weight: 500; }

        /* --- Social Section --- */
        .social-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 15px 0;
            background: linear-gradient(to bottom, #0a0a0a, #000);
        }
        .btn-social {
            text-decoration: none;
            padding: 9px 22px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            letter-spacing: 0.5px;
        }
        .fb-btn { background: #fff; color: #000; border: 1px solid #fff; }
        .wa-btn { background: transparent; color: #fff; border: 1px solid #333; }
        .btn-social:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,255,255,0.1); }

        /* --- Player Section --- */
        .container { max-width: 1400px; margin: 0 auto; padding: 0 15px; }
        .video-box {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            aspect-ratio: 16/9;
            box-shadow: 0 10px 50px rgba(0,0,0,1);
            margin-bottom: 25px;
            position: relative;
        }

        /* --- Category Tabs --- */
        .tabs {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            padding: 10px 0;
            margin-bottom: 20px;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }
        .tab {
            background: #141414;
            border: 1px solid #222;
            color: var(--text-gray);
            padding: 10px 24px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
            text-transform: uppercase;
        }
        .tab.active { background: #fff; color: #000; border-color: #fff; }

        /* --- Fixed 3 Column Grid --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding-bottom: 80px;
        }
        .item {
            background: var(--surface);
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            padding: 15px 5px;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 105px;
            transition: all 0.3s ease;
        }
        .item:hover { border-color: #555; background: #161616; transform: translateY(-2px); }
        .item.active { background: #fff; border-color: #fff; }
        .item.active .ch-name { color: #000; }

        .ch-logo { width: 38px; height: 38px; object-fit: contain; margin-bottom: 10px; filter: grayscale(1); opacity: 0.8; }
        .item:hover .ch-logo { filter: grayscale(0); opacity: 1; }
        .ch-emoji { font-size: 26px; margin-bottom: 10px; display: block; }
        
        .ch-name {
            font-size: 10px;
            font-weight: 700;
            color: #d1d1d1;
            line-height: 1.2;
            padding: 0 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }

        @media (min-width: 768px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">CCPLC <span style="font-weight: 300; opacity: 0.6;">CCTV</span></div>
    <div class="clock" id="clock">Loading...</div>
</header>

<div class="social-bar">
    <a href="https://www.facebook.com/Tometopata/" target="_blank" class="btn-social fb-btn">
        <i class="fab fa-facebook-f"></i> FACEBOOK
    </a>
    <a href="https://wa.me/qr/WF4LWSQPWAD3K1" target="_blank" class="btn-social wa-btn">
        <i class="fab fa-whatsapp"></i> WHATSAPP
    </a>
</div>

<div class="container">
    <div class="video-box">
        <video id="tv-player" class="video-js vjs-big-play-centered" controls preload="auto" poster="https://i.ibb.co/3pXnB9K/loading.jpg"></video>
        <iframe id="iframe-player" style="display:none; width:100%; height:100%; border:none;" allowfullscreen="true" scrolling="no"></iframe>
    </div>

    <div class="tabs" id="tabs-list"></div>
    <div class="grid" id="grid-list"> loading channels... </div>
</div>

<script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
<script>
    function updateClock() {
        const now = new Date();
        const d = now.toLocaleDateString('bn-BD', {weekday:'short', day:'numeric', month:'short'});
        const t = now.toLocaleTimeString('bn-BD', {hour:'2-digit', minute:'2-digit'});
        document.getElementById('clock').innerText = `${d} | ${t}`;
    }
    setInterval(updateClock, 1000); updateClock();

    // চ্যানেলের ডাটা ও ফিল্টারিং লজিক
    const manualChannels = [
        { name: "T-Sports HD", url: "https://bongoflixbd.top/r/?watch=b0aeb53ec98c74b3b1bb5f16acf8f056", logo: "📺", category: "SPORTS", isIframe: true },
        { name: "Star Sports 1", url: "https://bongoflixbd.top/r/?watch=339dcfaa4f761b545a5b815ee54a9bad", logo: "🏏", category: "SPORTS", isIframe: true }
    ];

    const m3uMain = 'https://raw.githubusercontent.com/omnixmain/OMNIX-PLAYLIST-ZONE/refs/heads/main/playlist/RoarZoneTv.m3u';
    const m3uBangla = 'https://raw.githubusercontent.com/cctvccplc/Tv-Test/refs/heads/main/BD26.m3u8';

    // যে নামগুলো চ্যানেল লিস্ট থেকে বাদ যাবে (Filtering)
    const filterList = ['t sports', 'star sports 1', 'star sports 2', 'sony ten 1', 'sony ten 2', 'sony ten 3', 'sony six', 'star sports select 1', 'star sports select 2', 'euro sports'];

    let masterData = {};
    let player;

    document.addEventListener("DOMContentLoaded", () => {
        player = videojs('tv-player', { fluid: true });
        initLoad();
    });

    async function initLoad() {
        manualChannels.forEach(c => pushData(c));
        try {
            const [res1, res2] = await Promise.all([
                fetch(m3uMain).then(r => r.text()),
                fetch(m3uBangla).then(r => r.text())
            ]);
            parseM3U(res1, false);
            parseM3U(res2, true);
            renderTabs();
            loadCategory('SPORTS');
        } catch (e) { console.error("Load Error"); }
    }

    function pushData(ch) {
        if (!masterData[ch.category]) masterData[ch.category] = [];
        masterData[ch.category].push(ch);
    }

    function parseM3U(data, isBangla) {
        const lines = data.split('\n');
        let temp = null;
        lines.forEach(line => {
            if (line.includes('#EXTINF:')) {
                const name = line.split(',')[1]?.trim() || "Unknown";
                
                // ফিল্টারিং লজিক: যদি নাম আমাদের বাদ দেওয়া লিস্টে থাকে, তবে এড়িয়ে যাবে
                if (filterList.some(f => name.toLowerCase().includes(f)) && !isBangla) {
                    temp = null;
                    return;
                }

                const logo = line.match(/tvg-logo="([^"]+)"/)?.[1] || "";
                let group = line.match(/group-title="([^"]+)"/)?.[1]?.toUpperCase() || "OTHER";
                if(isBangla) group = "BANGLA";
                else if (group === "BANGLA") return; // মেইন ফাইল থেকে বাংলা ক্যাটাগরি বাদ (ডুপ্লিকেট এড়াতে)

                temp = { name, logo, category: group, isIframe: false };
            } else if (line.startsWith('http') && temp) {
                temp.url = line.trim();
                pushData(temp);
                temp = null;
            }
        });
    }

    function renderTabs() {
        const tabs = document.getElementById('tabs-list');
        const cats = Object.keys(masterData).sort();
        const prio = ["SPORTS", "BANGLA"];
        const sorted = [...new Set([...prio.filter(p => cats.includes(p)), ...cats])];
        tabs.innerHTML = sorted.map(c => `<button class="tab" onclick="loadCategory('${c}')" id="tab-${c}">${c}</button>`).join('');
    }

    function loadCategory(cat) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(`tab-${cat}`).classList.add('active');

        const grid = document.getElementById('grid-list');
        const list = masterData[cat] || [];
        grid.innerHTML = list.map(ch => {
            const logo = (ch.logo && ch.logo.startsWith('http')) 
                ? `<img class="ch-logo" src="${ch.logo}" onerror="this.outerHTML='<span class=\'ch-emoji\'>📺</span>'">` 
                : `<span class="ch-emoji">${ch.logo || '📺'}</span>`;
            return `<div class="item" onclick="play('${ch.url}', ${ch.isIframe}, this)">${logo}<div class="ch-name">${ch.name}</div></div>`;
        }).join('');
    }

    function play(url, isIframe, el) {
        const v = document.querySelector('.video-js');
        const f = document.getElementById('iframe-player');
        document.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');

        if (isIframe) {
            player.pause(); v.style.display = 'none'; f.style.display = 'block'; f.src = url;
        } else {
            f.style.display = 'none'; f.src = ''; v.style.display = 'block';
            player.src({ src: url, type: 'application/x-mpegURL' });
            player.play().catch(()=>{});
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
</body>
</html>
