<!DOCTYPE html>
<html><head><title>Admin Panel</title>
<meta name="viewport" content="width=device-width">
<style>
body{background:#020617;color:#fff;font-family:Arial;padding:20px}
input,select,textarea,button{width:100%;padding:10px;margin:6px 0}
.box{background:#1e293b;padding:15px;margin-bottom:15px}
</style></head><body>
<h2>Admin Panel</h2>

<div class="box">
<h3>Add Channel</h3>
<input id="name" placeholder="Channel Name">
<input id="url" placeholder="M3U8 URL">
<select id="cat"><option>Sports</option><option>News</option><option>Entertainment</option></select>
<button onclick="addChannel()">Add Channel</button>
</div>

<div class="box">
<h3>Ads / Text</h3>
<textarea id="adtext"></textarea>
<button onclick="saveAds()">Save</button>
</div>

<div class="box"><h3>Channels</h3><div id="list"></div></div>

<script src="admin.js"></script>
</body></html>
